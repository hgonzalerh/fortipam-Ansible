---
# Fetch a FortiPAM secret using only ansible.builtin.uri, then apply the
# retrieved username and password to all hosts in a pre-defined inventory
# group via play-level vars.
#
# Required env vars on the controller:
#   FORTIPAM_INSTANCE  e.g. https://pam.example.com:443
#   FORTIPAM_TOKEN     API user's bearer token
#
- name: Fetch FortiPAM secret credentials
  hosts: localhost
  gather_facts: false
  vars:
    fpam_secret: "Hugo"
    fpam_instance: "{{ lookup('env', 'FORTIPAM_INSTANCE') }}"
    fpam_token: "{{ lookup('env', 'FORTIPAM_TOKEN') }}"
    fpam_skip_tls_verify: true

  tasks:
    - name: Get the FortiPAM secret and field Username
      ansible.builtin.include_role:
        name: get_fortipam_secret
      vars:
        get_fortipam_secret_secret_name: "{{ fpam_secret }}"
        get_fortipam_secret_secret_field: "Username"
        get_fortipam_secret_skip_tls_verify: true

    - name: Print the extracted field Username
      ansible.builtin.debug:
        msg: 'Field cleartext is: {{ get_fortipam_secret_field_cleartext }}'

    - name: Save username for next play
      ansible.builtin.set_fact:
        fpam_username: "{{ get_fortipam_secret_field_cleartext }}"

    - name: Get the FortiPAM secret and field Password
      ansible.builtin.include_role:
        name: get_fortipam_secret
      vars:
        get_fortipam_secret_secret_name: "{{ fpam_secret }}"
        get_fortipam_secret_secret_field: "Password"
        get_fortipam_secret_skip_tls_verify: true

    - name: Print the extracted field Password
      ansible.builtin.debug:
        msg: 'Field cleartext is: {{ get_fortipam_secret_field_cleartext }}'

    - name: Save password for next play
      ansible.builtin.set_fact:
        fpam_password: "{{ get_fortipam_secret_field_cleartext }}"

    - name: Print the secret object
      ansible.builtin.debug:
        msg: Object is {{ get_fortipam_secret_full_array }}

- name: Apply FortiPAM-retrieved credentials to inventory targets
  hosts: fpam_managed
  gather_facts: false
  vars:
    ansible_user: "{{ hostvars['localhost'].fpam_username }}"
    ansible_password: "{{ hostvars['localhost'].fpam_password }}"
  tasks:
    - name: Confirm we can run a command as the FortiPAM-stored user
      ansible.builtin.package: 
        name: '*'
        state: latest

